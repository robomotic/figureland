defaults:
  - _self_
  - shapes: default
  - physics: default
  - rendering: default
  - parallel: default
  - output: default

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  output_subdir: .hydra

resolution: [256, 256]
episode_length: 100
fps: 30
anti_alias: 2
use_gpu: True
device: null
batch_size: 32
parallel_workers: 4
seed: 42
deterministic: True
output_dir: ./output
