resolution:
- 256
- 256
episode_length: 100
fps: 30
anti_alias: 2
use_gpu: true
device: null
batch_size: 32
parallel_workers: 4
seed: 42
deterministic: true
output_dir: ./output
shapes:
  shape_types:
  - square
  - rectangle
  - triangle
  - hexagon
  - trapezoid
  size_range:
  - 0.05
  - 0.2
  mass_range:
  - 0.1
  - 10.0
  elasticity_range:
  - 0.2
  - 0.9
  aspect_ratio_mode: variable
  fixed_aspect_ratio: null
physics:
  environment_type: rectangle
  bounds:
  - -1.0
  - 1.0
  gravity: 9.8
  friction: 0.05
  air_resistance: 0.01
  force_field: null
  dt: 0.016666666666666666
  substeps: 4
  collisions_enabled: true
rendering:
  anti_alias: 2
  background_color:
  - 0.0
  - 0.0
  - 0.0
parallel:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed_offsets:
    train: 0
    val: 1000000
    test: 2000000
output:
  formats:
  - png
  - h5
  video_codec: mp4v
  video_fps: 30
  h5_compression: gzip
