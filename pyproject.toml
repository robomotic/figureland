[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figureland"
version = "0.1.0"
authors = [
  { name="Figureland Team", email="dev@figureland.ai" }
]
description = "High-performance dataset generator for vision architectures (I-JEPA, V-JEPA, ViT)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "h5py>=3.0.0",
    "pandas>=1.3.0",
    "pyarrow>=10.0.0",
    "fastavro>=1.7.0",
    "pillow>=9.0.0",
    "tqdm>=4.60.0",
    "hydra-core>=1.2.0",
    "omegaconf>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
cloud = [
    "modal>=0.62.0",
]
all = [
    "figureland[dev,cloud]",
]

[project.urls]
Homepage = "https://github.com/figureland/figureland"
Repository = "https://github.com/figureland/figureland.git"
Documentation = "https://figureland.readthedocs.io/"

[project.scripts]
figureland = "figureland.cli:main"

[tool.setuptools]
packages = ["figureland"]
include-package-data = true

[tool.setuptools.package-data]
figureland = ["py.typed"]
"*" = ["config/**/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.flake8]
max-line-length = 100
extend-ignore = ['E203', 'W503']

[tool.mypy]
python_version = "3.8"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --cov=figureland --cov-report=term-missing"
